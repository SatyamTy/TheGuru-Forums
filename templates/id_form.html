{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}

<h1 style="text-align:center; margin-block:50px; color:grey;">hey, {{user}}! Generate your ID card.</h1>
<h2>Just fill the form down below and your id card will be generated shortly.</h2>
<form method="POST" enctype="multipart/form-data" style="margin-left:150px;">
    {% csrf_token %}
    {{form|crispy}}
    <input type="submit" value="save" style="margin-block:50px;">
</form>

{% endblock content %}
